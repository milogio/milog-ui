name: Publish UI image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check UI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check contracts, lint, types, tests, and production build
        run: npm run check

  publish:
    name: Publish production UI image
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the same release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set image name and unique release tag
        id: release
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/milog-ui" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish standalone UI image
        id: ui
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            org.opencontainers.image.description=MiLog Next.js UI
          cache-from: type=gha,scope=milog-ui
          cache-to: type=gha,mode=max,scope=milog-ui

      - name: Report production image configuration
        env:
          UI_IMAGE: ${{ steps.release.outputs.image }}
          UI_DIGEST: ${{ steps.ui.outputs.digest }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          digest="${UI_DIGEST#sha256:}"
          [[ "$UI_DIGEST" == sha256:* && "$digest" =~ ^[a-f0-9]{64}$ ]]
          {
            echo '## Published MiLog UI release'
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Release tag: ${RELEASE_TAG}"
            echo
            echo 'Copy these lines into /opt/milog-ui/.env.production:'
            echo '```ini'
            echo "MILOG_UI_REPOSITORY=${UI_IMAGE}"
            echo "MILOG_UI_DIGEST=${digest}"
            echo 'MILOG_UI_ORIGIN=https://app.milog.ca'
            echo '```'
            echo
            echo 'Keep your persistent session secret on the server. Publishing does not deploy or enable signup.'
          } >> "$GITHUB_STEP_SUMMARY"
